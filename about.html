<script src="app.js?v=1794909303"></script>
<script>
$('#storyImg').insertAdjacentHTML('afterbegin',`<img src="${IMG.r1}" alt="" loading="lazy" onerror="this.remove()">`);
function gallery(){
  $('#gallery').innerHTML=GALLERY.map((g,i)=>g.img
    ?`<div class="ph reveal in d${i%4}"><img src="${g.img}" alt="${t(g.key+'_h')}" loading="lazy" onerror="this.remove()"></div>`
    :`<div class="slot reveal in d${i%4}"><span class="slot-n">0${i+1}</span>
        <div class="slot-c"><span class="slot-ic">${LH.ic('camera')}</span>
        <h4>${t(g.key+'_h')}</h4><p>${t(g.key+'_p')}</p>
        <small>${t('slot')} · ${t('o_'+g.o)}</small></div></div>`).join('');
}
document.addEventListener('lang',gallery);
LH.faq(); LH.lightbox(); LH.init();
</script>
