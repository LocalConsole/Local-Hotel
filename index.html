<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Hotel — Ташкент, Себзор · панорамные апартаменты</title>
<meta name="description" content="Local Hotel в Ташкенте: двухуровневые апартаменты с панорамным видом, рядом Tashkent City. Можно с детьми и с питомцем. Рейтинг 5.0.">
<meta property="og:title" content="Local Hotel — город под вашим окном">
<meta property="og:description" content="Панорамные апартаменты в Ташкенте. Можно с детьми и питомцем. Бронирование напрямую.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1794909303">
<script>document.documentElement.dataset.theme=(()=>{try{return localStorage.getItem('lh_theme')||'light'}catch(e){return'light'}})()</script>
</head>
<body data-page="home">

<!-- ГЛАВНЫЙ ЭКРАН -->
<section class="hero" id="hero">
  <div class="hero-glow" id="glow"></div>
  <div class="stars" id="stars"></div>
  <div class="shoot" style="top:12%;right:22%"></div>
  <div class="shoot" style="top:22%;right:48%;animation-delay:3.5s"></div>
  <div id="clouds"></div>
  <div class="birds" id="birds"></div>
  <div class="orbs" id="orb"><div class="o-sun"></div><div class="o-moon"></div></div>
  <div class="hero-sky city-auto" id="heroSky"><svg data-city="420" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice"></svg></div>

  <div class="hero-inner">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 class="h1 split" data-i18n="h1"></h1>
    <p class="hero-sub reveal d2" data-i18n="hero_sub"></p>
  </div>

  <div class="rating-chip">
    <b>5.0</b>
    <div><div class="stars5">★★★★★</div><small data-i18n="chip"></small></div>
  </div>

  <form class="book-bar" id="quick" autocomplete="off">
    <div class="field"><label data-i18n="f_in"></label><input type="date" id="qIn" required></div>
    <div class="field"><label data-i18n="f_out"></label><input type="date" id="qOut" required></div>
    <div class="field"><label data-i18n="f_guests"></label>
      <select id="qG"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="field"><label data-i18n="f_room"></label><select id="qRoom"></select></div>
    <button class="btn btn-gold" type="submit"><span data-i18n="check"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</section>

<!-- БЕГУЩАЯ СТРОКА + КОТ -->
<div class="marquee" id="marquee"><div class="marquee-track" id="mq"></div></div>

<!-- ОДИН ДЕНЬ В LOCAL -->
<section class="sec day" id="day">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="day_k"></div>
    <h2 class="h2 split" data-i18n="day_h"></h2>
    <div class="day-grid">
      <div class="day-sticky">
        <div class="day-sky s0" id="daySky">
          <i class="sky-l l0"></i><i class="sky-l l1"></i><i class="sky-l l2"></i><i class="sky-l l3"></i>
          <div class="day-stars" id="dayStars"></div>
          <div class="d-sun"></div><div class="d-moon"></div>
          <div class="day-time" id="dayTime">08:00</div>
          <div class="day-city"><svg id="daySvg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice"></svg></div>
        </div>
      </div>
      <div class="day-steps">
        <div class="step" data-s="0"><span class="time" data-i18n="d1_t"></span><h3 data-i18n="d1_h"></h3><p data-i18n="d1_p"></p></div>
        <div class="step" data-s="1"><span class="time" data-i18n="d2_t"></span><h3 data-i18n="d2_h"></h3><p data-i18n="d2_p"></p></div>
        <div class="step" data-s="2"><span class="time" data-i18n="d3_t"></span><h3 data-i18n="d3_h"></h3><p data-i18n="d3_p"></p></div>
        <div class="step" data-s="3"><span class="time" data-i18n="d4_t"></span><h3 data-i18n="d4_h"></h3><p data-i18n="d4_p"></p></div>
      </div>
    </div>
  </div>
</section>

<!-- ДЛЯ ВСЕЙ СЕМЬИ -->
<section class="sec" style="padding-top:30px">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="fam_k"></div>
    <h2 class="h2 split" data-i18n="fam_h"></h2>
    <p class="lead reveal d1" style="margin-top:24px" data-i18n="fam_p"></p>
    <div class="family">
      <a href="booking.html?kids=1" class="fam reveal" data-tilt><div class="ph" id="famKids"></div>
        <div><span class="emo" data-ic="kid"></span><h3 data-i18n="fam1_h"></h3><p data-i18n="fam1_p"></p></div></a>
      <a href="booking.html?pet=1" class="fam reveal d1" data-tilt><div class="ph" id="famPet"></div>
        <div><span class="emo" data-ic="pet"></span><h3 data-i18n="fam2_h"></h3><p data-i18n="fam2_p"></p></div></a>
      <a href="booking.html?room=pano" class="fam reveal d2" data-tilt><div class="ph" id="famTwo"></div>
        <div><span class="emo" data-ic="heart"></span><h3 data-i18n="fam3_h"></h3><p data-i18n="fam3_p"></p></div></a>
    </div>
  </div>
</section>

<!-- КУДА ДАЛЬШЕ -->
<section class="sec" style="padding-top:30px">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="go_k"></div>
    <h2 class="h2 split" data-i18n="go_h"></h2>
    <div class="go-grid">
      <a href="rooms.html" class="go reveal"><div class="ph" id="go1"></div><span class="go-n">01</span>
        <div class="go-t"><h3 data-i18n="go1"></h3><p data-i18n="go1s"></p></div><span class="go-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
      <a href="about.html" class="go reveal d1"><div class="ph" id="go2"></div><span class="go-n">02</span>
        <div class="go-t"><h3 data-i18n="go2"></h3><p data-i18n="go2s"></p></div><span class="go-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
      <a href="booking.html" class="go gold reveal d2"><span class="go-n">03</span>
        <div class="go-cal" id="goCal"></div>
        <div class="go-t"><h3 data-i18n="go3"></h3><p data-i18n="go3s"></p></div><span class="go-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
    </div>
  </div>
</section>

<script src="app.js?v=1794909303"></script>
<script>

/* фото */
const img=(id,src)=>$(id).insertAdjacentHTML('afterbegin',`<img src="${src}" alt="" loading="lazy" onerror="this.remove()">`);
img('#famKids',IMG.kids); img('#famPet',IMG.dogs); img('#famTwo',ROOMS[2].img);

/* небо: звёзды, облака, птицы */
const st=$('#stars');
for(let i=0;i<110;i++){const s=document.createElement('i');s.style.cssText=`left:${rnd(0,100)}%;top:${rnd(0,100)}%;animation-delay:${rnd(0,3)}s;transform:scale(${rnd(.5,1.4)})`;st.appendChild(s)}
[[8,220,55],[18,160,75],[30,260,95]].forEach(([top,w,dur],i)=>$('#clouds').insertAdjacentHTML('beforeend',`<div class="cloud" style="top:${top}%;width:${w}px;animation-duration:${dur}s;animation-delay:-${i*22}s"></div>`));
/* стая: силуэты птиц с гнущимися крыльями (morph), у каждой свой ритм */
const W={up:'M0 4 Q7 -1 13 7 L16 8 L19 7 Q25 -1 32 4 Q25 3 19 10 L16 11 L13 10 Q7 3 0 4 Z',mid:'M0 9 Q7 6 13 8 L16 8 L19 8 Q25 6 32 9 Q25 8 19 10 L16 11 L13 10 Q7 8 0 9 Z',dn:'M3 15 Q8 9 13 8 L16 8 L19 8 Q24 9 29 15 Q24 12 19 10 L16 11 L13 10 Q8 12 3 15 Z'};
const flap=[W.mid,W.up,W.mid,W.dn,W.mid,W.up,W.mid,W.dn,W.mid,W.up,W.mid,W.mid,W.mid].join(';');
const kt=[...Array(13)].map((_,i)=>(i/12).toFixed(3)).join(';');
const ks=[...Array(12)].map(()=>'.45 0 .55 1').join(';');
[[16,0,38,1],[34,-1.4,38,.82],[2,-2.3,38,.74],[58,-19,46,1.05],[44,-20.5,46,.7]].forEach(([top,del,dur,sc],i)=>$('#birds').insertAdjacentHTML('beforeend',
 `<div class="bird" style="top:${top}px;animation-delay:${del}s;animation-duration:${dur}s"><div class="bob" style="animation-duration:${(3.2+i*.6).toFixed(1)}s;animation-delay:-${i}s">
  <svg viewBox="-2 -3 36 20" style="width:${(34*sc).toFixed(0)}px;height:${(19*sc).toFixed(0)}px"><path d="${W.mid}">
   <animate attributeName="d" dur="${(1.9+i*.23).toFixed(2)}s" begin="-${(i*.37).toFixed(2)}s" repeatCount="indefinite" values="${flap}" keyTimes="${kt}" calcMode="spline" keySplines="${ks}"/></path></svg></div></div>`));

/* свечение и параллакс */
const hero=$('#hero'),glow=$('#glow');
hero.addEventListener('mousemove',e=>{const r=hero.getBoundingClientRect();glow.style.left=(e.clientX-r.left)+'px';glow.style.top=(e.clientY-r.top)+'px'});
addEventListener('scroll',()=>{const y=scrollY;if(y<innerHeight){$('#heroSky').style.transform=`translateY(${y*.22}px)`;$('#orb').style.transform=`translateY(${y*.5}px)`}},{passive:true});

/* быстрый поиск → страница бронирования */
const iso=d=>d.toISOString().slice(0,10);
$('#qIn').min=iso(new Date());$('#qIn').value=iso(new Date(Date.now()+864e5));$('#qOut').value=iso(new Date(Date.now()+3*864e5));
$('#qIn').onchange=()=>{if($('#qOut').value<=$('#qIn').value){const n=new Date($('#qIn').value);n.setDate(n.getDate()+1);$('#qOut').value=iso(n)}};
$('#quick').onsubmit=e=>{e.preventDefault();
  const q=new URLSearchParams({in:$('#qIn').value,out:$('#qOut').value,adults:$('#qG').value,room:$('#qRoom').value});
  const a=document.createElement('a');a.href='booking.html?'+q;document.body.appendChild(a);a.click()};

/* кот */
LH.cat($('#marquee'));


/* один день: небо меняется при прокрутке */
const sky=$('#daySky');
city($('#daySvg'),420,{c1:'var(--b1)',c2:'var(--b2)',c3:'var(--b3)',lit:'#ffd890'});
for(let i=0;i<60;i++){const s=document.createElement('i');s.style.cssText=`left:${rnd(0,100)}%;top:${rnd(0,55)}%;animation-delay:${rnd(0,3)}s`;$('#dayStars').appendChild(s)}
const PAL=[['#e9c6b5','#c69c93','#9b7d86'],['#a9c2da','#7d97b5','#5b7392'],['#7a5277','#4c3560','#2a2140'],['#1a2448','#0e1530','#070a12']];
function setDay(i){
  sky.className='day-sky s'+i;
  PAL[i].forEach((c,k)=>sky.style.setProperty('--b'+(k+1),c));
  $('#dayTime').textContent=['08:00','13:00','19:00','23:00'][i];
  $$('.step').forEach(st=>st.classList.toggle('on',+st.dataset.s===i));
}
setDay(0);
const dio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setDay(+e.target.dataset.s)}),{rootMargin:'-45% 0px -45% 0px'});
$$('.step').forEach(st=>dio.observe(st));

/* карточки «куда дальше» */
img('#go1',ROOMS[1].img); img('#go2',IMG.about);
const d0=new Date();$('#goCal').innerHTML=[...Array(14)].map((_,i)=>{const d=new Date(d0.getTime()+i*864e5);return `<span class="${i>=1&&i<=3?'sel':''}">${d.getDate()}</span>`}).join('');

/* динамика при смене языка */
function render(){
  const it=t('mq').map(x=>`<span>${x}</span>`).join('');$('#mq').innerHTML=it+it+it;
  const sel=$('#qRoom'),cur=sel.value||'loft';
  sel.innerHTML=ROOMS.map(r=>`<option value="${r.id}">${t('r_'+r.id)}</option>`).join('');sel.value=cur;
}
document.addEventListener('lang',render);
LH.init();
</script>
</body>
</html>
